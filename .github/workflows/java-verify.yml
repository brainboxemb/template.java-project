name: Java reference-consumer verification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout without submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require clean checkout
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ($status) { git status --short; throw "Checkout is not clean." }
      - name: Bootstrap released tooling
        shell: pwsh
        run: |
          .\bootstrap.ps1
          if ((git -C tools/tool.git-project rev-parse HEAD).Trim() -ne "d6d760845967f70bd266b3ac2b36c9d5b0edc862") { throw "Unexpected tool.git-project SHA" }
          if ((git -C tools/tool.java-project rev-parse HEAD).Trim() -ne "9c147850adb9c0c270d852166feae5f08f56c2d6") { throw "Unexpected tool.java-project SHA" }
          if (-not (Select-String -Path project.yml -SimpleMatch 'ref: v0.2.0')) { throw "Semantic tool release ref is missing." }
          .\tools\tool.git-project\git-project.ps1 validate -RepoRoot .

  linux-canonical:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact consumer revision with Moon VCS history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Bootstrap released tooling
        shell: bash
        run: |
          set -euo pipefail
          ./bootstrap.sh
          test "$(git -C tools/tool.git-project rev-parse HEAD)" = "d6d760845967f70bd266b3ac2b36c9d5b0edc862"
          test "$(git -C tools/tool.java-project rev-parse HEAD)" = "9c147850adb9c0c270d852166feae5f08f56c2d6"
          grep -F 'ref: v0.2.0' project.yml
          tools/tool.git-project/git-project.sh validate --repo .

      - name: Set up exact Java 8 baseline
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '8.0.504+1'
          check-latest: false
          verify-signature: true
          cache: maven
          cache-dependency-path: pom.xml

      - name: Run or hydrate canonical Java task
        uses: brainboxemb/tool.git-project/moon@v0.2.2
        with:
          task: consumer:java.canonical
          cache-namespace: template-java-canonical

      - name: Verify canonical output and current materialization evidence
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          execution='bld/evidence/executions/java-canonical/execution.json'
          test -f bld/artifacts/template-java-project-0.1.0-SNAPSHOT.jar
          test -f bld/evidence/tests/README.md
          test -f bld/README.md
          test -s bld/evidence/executions/java-canonical/execution.log
          test ! -e bld/evidence/execution.log
          test -s "$execution"
          grep -F '"schema": "brainboxemb.execution-evidence"' "$execution"
          grep -F '"schema_version": 1' "$execution"
          grep -F '"capability": "java.canonical"' "$execution"
          grep -F '"owner": "brainboxemb/tool.java-project"' "$execution"
          grep -F '"action": "canonical"' "$execution"
          grep -F '"owner_revision": "9c147850adb9c0c270d852166feae5f08f56c2d6"' "$execution"
          grep -F '"tool_java_project_version": "0.2.0"' "$execution"
          grep -F '"status": "success"' "$execution"
          grep -F '## Producer execution evidence' bld/README.md
          grep -F '## Domain evidence' bld/README.md
          grep -F '## Orchestration/materialization evidence' bld/README.md
          grep -F '## Publication context' bld/README.md
          test -f .moon/invocations/consumer_java.canonical/materialization.json
          test -f .moon/invocations/consumer_java.canonical/moon.log
          grep -F '"source_revision": "'"$SOURCE_REVISION"'"' .moon/invocations/consumer_java.canonical/materialization.json
          grep -F '"status": "success"' .moon/invocations/consumer_java.canonical/materialization.json

      - name: Upload exact canonical Linux artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: template-java-project-canonical
          path: bld/artifacts/template-java-project-0.1.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 14

      - name: Stage producer output with current Moon materialization evidence
        shell: bash
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/template-java-project-publication"
          rm -rf "$staging"
          mkdir -p "$staging/orchestration"
          cp -a bld/. "$staging/"
          cp .moon/invocations/consumer_java.canonical/moon.log "$staging/orchestration/moon.log"
          cp .moon/invocations/consumer_java.canonical/materialization.json "$staging/orchestration/materialization.json"

      - name: Upload prepared build publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: template-java-project-canonical-publication
          path: ${{ runner.temp }}/template-java-project-publication
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: [linux-canonical, bootstrap-windows]
    uses: brainboxemb/tool.java-project/.github/workflows/reusable-java-windows-compatibility.yml@9c147850adb9c0c270d852166feae5f08f56c2d6
    with:
      working-directory: .
      java-version: '8.0.504+1'
      maven-version: '3.9.16'
      maven-wrapper-version: '3.3.4'
      artifact-name: template-java-project-canonical
      runnable-jar-name: template-java-project-0.1.0-SNAPSHOT.jar
      smoke-expected-output: 'template.java-project OK'
      test-report-path: 'target/surefire-reports/**'

  verify-test-summary:
    needs: linux-canonical
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download prepared publication
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: template-java-project-canonical-publication
          path: publication
      - name: Verify producer and materialization evidence
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          execution='publication/evidence/executions/java-canonical/execution.json'
          test -f publication/evidence/tests/README.md
          test -f publication/README.md
          grep -F '# Unit test report' publication/evidence/tests/README.md
          grep -F '**Status: PASS**' publication/evidence/tests/README.md
          test -s publication/evidence/executions/java-canonical/execution.log
          test ! -e publication/evidence/execution.log
          test -s "$execution"
          grep -F '"schema": "brainboxemb.execution-evidence"' "$execution"
          grep -F '"owner_revision": "9c147850adb9c0c270d852166feae5f08f56c2d6"' "$execution"
          grep -F '"tool_java_project_version": "0.2.0"' "$execution"
          grep -F '## Producer execution evidence' publication/README.md
          grep -F '## Domain evidence' publication/README.md
          grep -F '## Orchestration/materialization evidence' publication/README.md
          grep -F '## Publication context' publication/README.md
          test -f publication/orchestration/materialization.json
          grep -F '"source_revision": "'"$SOURCE_REVISION"'"' publication/orchestration/materialization.json
          grep -F '"status": "success"' publication/orchestration/materialization.json

  publish-build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: [windows, verify-test-summary]
    permissions:
      contents: write
    uses: brainboxemb/tool.java-project/.github/workflows/reusable-java-publish.yml@9c147850adb9c0c270d852166feae5f08f56c2d6
    with:
      publication-artifact-name: template-java-project-canonical-publication
