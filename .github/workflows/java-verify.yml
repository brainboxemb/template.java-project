name: Java reference-consumer verification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_revision:
        description: Exact comparison base commit for manual qualification
        required: true
        type: string
      windows_mode:
        description: Windows qualification override for this manual run
        required: true
        type: choice
        default: full
        options:
          - full
          - auto
          - smoke
          - none

permissions:
  contents: read

jobs:
  java-production:
    permissions:
      contents: read
    uses: brainboxemb/tool.java-project/.github/workflows/reusable-java-production.yml@c0ca2e1365a64bc626ca331a8170d13340ae0b36
    with:
      base-revision: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || inputs.base_revision }}
      head-revision: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      affected-task: consumer:java.canonical
      windows-full-task: consumer:java.windows-full
      windows-mode: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_mode || github.event_name == 'push' && 'none' || 'auto' }}
      working-directory: .
      java-version: '8.0.504+1'
      maven-version: '3.9.16'
      maven-wrapper-version: '3.3.4'
      artifact-name: template-java-project-canonical
      artifact-path: target/template-java-project-0.1.0.jar
      runnable-jar-name: template-java-project-0.1.0.jar
      smoke-expected-output: 'template.java-project OK'
      test-report-path: target/surefire-reports/**
      publication-artifact-paths: target/template-java-project-0.1.0.jar

  publish-build:
    if: >-
      needs.java-production.outputs.affected == 'true' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    needs: java-production
    permissions:
      contents: write
      actions: read
    uses: brainboxemb/tool.java-project/.github/workflows/reusable-java-publish.yml@c0ca2e1365a64bc626ca331a8170d13340ae0b36
    with:
      publication-artifact-name: template-java-project-canonical-publication
      preflight-artifact-name: template-java-project-canonical-preflight
