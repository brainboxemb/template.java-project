name: Recover PR 4 build preview cleanup

on:
  push:
    branches:
      - fix/pr-5-cleanup-input

permissions:
  contents: write

jobs:
  cleanup:
    uses: brainboxemb/tool.git-project/.github/workflows/reusable-pr-preview-cleanup.yml@v0.2.1
    with:
      pr_number: 4
      preview_suffixes: bld
