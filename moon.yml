tasks:
  java.canonical:
    command: "bash tools/tool.java-project/java-project.sh canonical --working-directory . --java-version '8.0.504+1' --maven-version '3.9.16' --maven-wrapper-version '3.3.4' --test-report-path 'target/surefire-reports/**' --publication-root bld --publication-artifact target/template-java-project-0.1.0-SNAPSHOT.jar"
    inputs:
      - 'project.yml'
      - 'project.java.yml'
      - 'pom.xml'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.mvn/**'
      - 'src/main/**'
      - 'src/test/**'
      - 'tools/tool.java-project/**'
      - 'moon.yml'
      - '.moon/workspace.yml'
    outputs:
      - 'bld/**'
    options:
      cache: true
